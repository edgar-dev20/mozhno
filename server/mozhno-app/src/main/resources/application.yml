logging:
  level:
    root: INFO
    dev.mozhno: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: DEBUG
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: feature-flags
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=${CACHE_TTL_MINUTES:5}m
  datasource:
    url: jdbc:postgresql://localhost:5432/feature_flags
    username: flags_user
    password: flags_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:30000}
      pool-name: mozhno-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  shutdown: graceful

app:
  upload-dir: ./uploads
  base-url: ${APP_BASE_URL:http://localhost:8080}
  email-from: ${EMAIL_FROM:noreply@mozhno.dev}
  client:
    max-metrics-per-key: ${CLIENT_MAX_METRICS_PER_KEY:1000}

jwt:
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktdGhhdC1pcy1hdC1sZWFzdC0zMi1ieXRlcy1sb25nLWZvci1kZXY=}
  issuer: ${JWT_ISSUER:mozhno}
  access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

audit:
  retention-days: 365

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    git:
      mode: full

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true
    filter: true
  api-docs:
    path: /v3/api-docs
