<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сброс пароля</title><style>{{style}}</style></head>
<body>
<div class="card">
  <div class="accent-bar"></div>
  <div class="card-body">
    <div class="wordmark">можно<span class="wordmark-dot">.</span></div>
    <h2>Сброс пароля</h2>
    <p class="body-text">Администратор отправил вам ссылку для сброса пароля.</p>
    <a class="btn" href="{{link}}" style="color:#fff;text-decoration:none">Сбросить пароль</a>
    <p class="fine-print">Ссылка действительна 1 час.</p>
  </div>
  <div class="card-divider"></div>
  <div class="fallback">
    <p>Если кнопка не работает, скопируйте ссылку:</p>
    <p class="fallback-link">{{link}}</p>
  </div>
  <div class="card-footer">
    <p>Вы получили это письмо, потому что администратор отправил сброс пароля.</p>
  </div>
</div>
</body>
</html>
