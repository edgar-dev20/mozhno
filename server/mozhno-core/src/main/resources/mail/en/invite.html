<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation to Mozhno</title><style>{{style}}</style></head>
<body>
<div class="card">
  <div class="accent-bar"></div>
  <div class="card-body">
    <div class="wordmark">можно<span class="wordmark-dot">.</span></div>
    <h2>Invitation</h2>
    <p class="body-text">You've been invited to join a project.</p>
    <a class="btn" href="{{link}}" style="color:#fff;text-decoration:none">Accept invitation</a>
    <p class="fine-print">This link expires in 7 days.</p>
  </div>
  <div class="card-divider"></div>
  <div class="fallback">
    <p>If the button doesn't work, copy this link:</p>
    <p class="fallback-link">{{link}}</p>
  </div>
  <div class="card-footer">
    <p>You received this email because you were invited to a project.</p>
  </div>
</div>
</body>
</html>
