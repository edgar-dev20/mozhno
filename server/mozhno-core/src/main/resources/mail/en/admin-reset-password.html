<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mozhno password reset</title><style>{{style}}</style></head>
<body>
<div class="card">
  <div class="accent-bar"></div>
  <div class="card-body">
    <div class="wordmark">можно<span class="wordmark-dot">.</span></div>
    <h2>Password reset</h2>
    <p class="body-text">An administrator sent you a password reset link.</p>
    <a class="btn" href="{{link}}" style="color:#fff;text-decoration:none">Reset password</a>
    <p class="fine-print">This link expires in 1 hour.</p>
  </div>
  <div class="card-divider"></div>
  <div class="fallback">
    <p>If the button doesn't work, copy this link:</p>
    <p class="fallback-link">{{link}}</p>
  </div>
  <div class="card-footer">
    <p>You received this email because an administrator sent a password reset.</p>
  </div>
</div>
</body>
</html>
