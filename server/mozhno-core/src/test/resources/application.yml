spring:
  application:
    name: feature-flags-test
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      connection-timeout: 30000
      connection-test-query: SELECT 1
      validation-timeout: 3000
      initialization-fail-timeout: -1
      keepalive-time: 30000
      max-lifetime: 120000
      idle-timeout: 600000
      leak-detection-threshold: 10000
      maximum-pool-size: 5

logging:
  level:
    org.testcontainers: WARN

server:
  port: 8080

mozhno:
  base-url: "http://localhost:8080"
  jwt:
    secret: "thisisatestsecretkeyforjwtthatisatleast32byteslong"
    issuer: "mozhno-test"
    access-token-ttl-minutes: 15
  security:
    rate-limit:
      enabled: false
