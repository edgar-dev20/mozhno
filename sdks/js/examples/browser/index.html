<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mozhno Client - Browser Example</title>
</head>
<body>
  <h1>Mozhno Client Example</h1>
  <div id="result">Loading...</div>

  <script type="module">
    import { MozhnoClient } from '../dist/mozhno-client.mjs';

    const mozhno = new MozhnoClient({
      url: 'https://flags.example.com',
      clientKey: 'your-frontend-key',
      appName: 'browser-example',
      mode: 'client',
      refreshInterval: 30,
    });

    mozhno.on('ready', () => {
      const el = document.getElementById('result');
      el.textContent = mozhno.isEnabled('example-feature') ? 'Feature is ON' : 'Feature is OFF';
    });

    mozhno.updateContext({ userId: '123' });
    mozhno.start();
  </script>
</body>
</html>
