networks:
  mozhno-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: mozhno-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feature_flags}
      POSTGRES_USER: ${POSTGRES_USER:-flags_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flags_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mozhno-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flags_user} -d ${POSTGRES_DB:-feature_flags}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mozhno:
    image: mozhnodev/mozhno:latest
    container_name: mozhno-server
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${MOZHNO_MANAGEMENT_PORT:-9090}:9090"
    environment:
      MOZHNO_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-feature_flags}
      MOZHNO_DB_USERNAME: ${POSTGRES_USER:-flags_user}
      MOZHNO_DB_PASSWORD: ${POSTGRES_PASSWORD:-flags_password}
      MOZHNO_JWT_SECRET: ${MOZHNO_JWT_SECRET:-}
      MOZHNO_BASE_URL: ${MOZHNO_BASE_URL:-http://localhost:8080}
      MOZHNO_DB_POOL_MAX_SIZE: ${MOZHNO_DB_POOL_MAX_SIZE:-20}
      MOZHNO_DB_POOL_MIN_IDLE: ${MOZHNO_DB_POOL_MIN_IDLE:-5}
      MOZHNO_SMTP_HOST: ${MOZHNO_SMTP_HOST:-localhost}
      MOZHNO_SMTP_PORT: ${MOZHNO_SMTP_PORT:-587}
      MOZHNO_SMTP_USERNAME: ${MOZHNO_SMTP_USERNAME:-}
      MOZHNO_SMTP_PASSWORD: ${MOZHNO_SMTP_PASSWORD:-}
      MOZHNO_MANAGEMENT_PORT: '9090'
      MOZHNO_INIT_EMAIL: ${MOZHNO_INIT_EMAIL:-}
      MOZHNO_INIT_PASSWORD: ${MOZHNO_INIT_PASSWORD:-}
    networks:
      - mozhno-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mozhno-pgadmin
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - mozhno-net

volumes:
  postgres_data:
  pgadmin_data:
