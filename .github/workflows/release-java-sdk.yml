name: Java SDK Release

on:
  push:
    tags:
      - 'sdk-java-v[0-9]+.[0-9]+.[0-9]+'
      - 'sdk-java-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  test-java-sdk:
    name: Test Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: server

      - name: Check and test
        working-directory: server
        run: ./gradlew :mozhno-client-java:check

  publish-java-sdk:
    name: Publish Java SDK to GitHub Packages
    needs: test-java-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: server

      - name: Publish Java SDK
        working-directory: server
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          VERSION="${TAG_VERSION#sdk-java-v}"
          echo "Publishing version: $VERSION"
          ./gradlew :mozhno-client-java:publish -Pversion="$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
